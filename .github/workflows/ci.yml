name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RENPY_VERSION: "8.5.3"
  RENPY_SDK_URL: https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.zip

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel
      - run: python -m pip install ./cli ./local_server ruff mypy
      - working-directory: kernel
        run: ruff check .
      - working-directory: kernel
        run: mypy
      - working-directory: cli
        run: ruff check .
      - working-directory: cli
        run: mypy
      - working-directory: local_server
        run: ruff check .
      - working-directory: local_server
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./kernel
      - run: python -m pip install ./cli ./local_server
      - working-directory: kernel
        run: python -m unittest discover -t . -s tests -v
      - working-directory: cli
        run: python -m unittest discover -t . -s tests -v
      - working-directory: local_server
        run: python -m unittest discover -t . -s tests -v
      - working-directory: renpy
        run: python -m unittest discover -t . -s tests -v

  kernel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build kernel --outdir dist/kernel
      - run: python -m pip install --no-cache-dir dist/kernel/*.whl
      - run: python -c "import amnesia_agent_kernel"
      - uses: actions/upload-artifact@v4
        with:
          name: python-kernel-dist
          path: dist/kernel/**
          if-no-files-found: error

  cli-build:
    needs: kernel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-kernel-dist
          path: dist/kernel
      - run: python -m pip install --upgrade build
      - run: python -m pip install --no-cache-dir --find-links dist/kernel amnesia-agent-kernel==0.6.0
      - run: python -m build cli --outdir dist/cli
      - run: python -m pip install --no-cache-dir --find-links dist/kernel dist/cli/*.whl
      - run: python -c "import amnesia_agent_cli"
      - uses: actions/upload-artifact@v4
        with:
          name: python-cli-dist
          path: dist/cli/**
          if-no-files-found: error

  local-server-build:
    needs: kernel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-kernel-dist
          path: dist/kernel
      - run: python -m pip install --upgrade build
      - run: python -m pip install --no-cache-dir --find-links dist/kernel amnesia-agent-kernel==0.6.0
      - run: python -m build local_server --outdir dist/local-server
      - run: python -m pip install --no-cache-dir --find-links dist/kernel dist/local-server/*.whl
      - run: python -c "import amnesia_agent_local_server"
      - uses: actions/upload-artifact@v4
        with:
          name: python-local-server-dist
          path: dist/local-server/**
          if-no-files-found: error

  electron-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: electron
        run: python -m pip install ../kernel ../local_server pyinstaller
      - working-directory: electron
        run: npm ci
      - working-directory: electron
        run: npm run typecheck
      - working-directory: electron
        run: npm test
      - working-directory: electron
        run: npm run build:server
      - working-directory: electron
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: amnesia-agent-electron-${{ matrix.artifact }}
          path: electron/release/**
          if-no-files-found: error

  renpy-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            package: win
          - os: macos-latest
            artifact: macos
            package: mac
          - os: ubuntu-latest
            artifact: linux
            package: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel ./local_server pyinstaller
      - name: Download Ren'Py SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .renpy-sdk | Out-Null
          Invoke-WebRequest -Uri $env:RENPY_SDK_URL -OutFile .renpy-sdk/sdk.zip
          Expand-Archive -Path .renpy-sdk/sdk.zip -DestinationPath .renpy-sdk -Force
      - name: Download Ren'Py SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p .renpy-sdk
          curl --fail --silent --show-error --location "$RENPY_SDK_URL" --output .renpy-sdk/sdk.zip
          unzip -q .renpy-sdk/sdk.zip -d .renpy-sdk
          chmod +x .renpy-sdk/renpy-"$RENPY_VERSION"-sdk/renpy.sh
      - name: Build bundled local server
        run: python electron/scripts/build-sidecar.py --output-dir renpy/game/server
      - name: Lint Ren'Py project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".renpy-sdk\renpy-$env:RENPY_VERSION-sdk\renpy.exe" renpy lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint Ren'Py project (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./.renpy-sdk/renpy-"$RENPY_VERSION"-sdk/renpy.sh renpy lint
      - name: Build Ren'Py distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".renpy-sdk\renpy-$env:RENPY_VERSION-sdk\renpy.exe" ".renpy-sdk\renpy-$env:RENPY_VERSION-sdk\launcher" distribute --destination renpy/dist --package "${{ matrix.package }}" renpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Ren'Py distribution (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./.renpy-sdk/renpy-"$RENPY_VERSION"-sdk/renpy.sh ./.renpy-sdk/renpy-"$RENPY_VERSION"-sdk/launcher distribute --destination renpy/dist --package "${{ matrix.package }}" renpy
      - uses: actions/upload-artifact@v4
        with:
          name: amnesia-agent-renpy-${{ matrix.artifact }}
          path: renpy/dist/**
          if-no-files-found: error
