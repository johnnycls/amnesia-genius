name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RENPY_VERSION: "8.5.3"
  RENPY_SDK_URL: https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.zip

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel
      - run: python -m pip install ./cli ./local_server ruff mypy
      - working-directory: kernel
        run: ruff check .
      - working-directory: kernel
        run: mypy
      - working-directory: cli
        run: ruff check .
      - working-directory: cli
        run: mypy
      - working-directory: local_server
        run: ruff check .
      - working-directory: local_server
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./kernel
      - run: python -m pip install ./cli ./local_server
      - working-directory: kernel
        run: python -m unittest discover -t . -s tests -v
      - working-directory: cli
        run: python -m unittest discover -t . -s tests -v
      - working-directory: local_server
        run: python -m unittest discover -t . -s tests -v
      - working-directory: renpy
        run: python -m unittest discover -t . -s tests -v

  kernel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build kernel --outdir dist/kernel
      - run: python -m pip install --no-cache-dir dist/kernel/*.whl
      - run: python -c "import amnesia_agent_kernel"
      - uses: actions/upload-artifact@v7
        with:
          name: python-kernel-dist
          path: dist/kernel
          if-no-files-found: error

  cli-build:
    needs: kernel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-kernel-dist
          path: dist/kernel
      - run: python -m pip install --upgrade build
      - run: python -m pip install --no-cache-dir --find-links dist/kernel amnesia-agent-kernel==0.0.0a0
      - run: python -m build cli --outdir dist/cli
      - run: python -m pip install --no-cache-dir --find-links dist/kernel dist/cli/*.whl
      - run: python -c "import amnesia_agent_cli"
      - uses: actions/upload-artifact@v7
        with:
          name: python-cli-dist
          path: dist/cli
          if-no-files-found: error

  local-server-build:
    needs: kernel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-kernel-dist
          path: dist/kernel
      - run: python -m pip install --upgrade build
      - run: python -m pip install --no-cache-dir --find-links dist/kernel amnesia-agent-kernel==0.0.0a0
      - run: python -m build local_server --outdir dist/local-server
      - run: python -m pip install --no-cache-dir --find-links dist/kernel dist/local-server/*.whl
      - run: python -c "import amnesia_agent_local_server"
      - uses: actions/upload-artifact@v7
        with:
          name: python-local-server-dist
          path: dist/local-server
          if-no-files-found: error

  electron-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - working-directory: electron
        run: python -m pip install ../kernel ../local_server pyinstaller
      - working-directory: electron
        run: npm ci
      - working-directory: electron
        run: npm run typecheck
      - working-directory: electron
        run: npm test
      - working-directory: electron
        run: npm run build:server
      - working-directory: electron
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: amnesia-agent-electron-${{ matrix.artifact }}
          path: electron/release
          if-no-files-found: error

  renpy-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            package: win
          - os: macos-latest
            artifact: macos
            package: mac
          - os: ubuntu-latest
            artifact: linux
            package: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel ./local_server pyinstaller
      - name: Download Ren'Py SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .renpy-sdk | Out-Null
          Invoke-WebRequest -Uri $env:RENPY_SDK_URL -OutFile .renpy-sdk/sdk.zip
          Expand-Archive -Path .renpy-sdk/sdk.zip -DestinationPath .renpy-sdk -Force
      - name: Download Ren'Py SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p .renpy-sdk
          curl --fail --silent --show-error --location "$RENPY_SDK_URL" --output .renpy-sdk/sdk.zip
          unzip -q .renpy-sdk/sdk.zip -d .renpy-sdk
          chmod +x .renpy-sdk/renpy-"$RENPY_VERSION"-sdk/renpy.sh
      - name: Build bundled local server
        run: python electron/scripts/build-sidecar.py --output-dir renpy/game/server
      - name: Lint Ren'Py project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: renpy
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE ".renpy-sdk\renpy-$env:RENPY_VERSION-sdk"
          $lint = Start-Process -FilePath (Join-Path $sdk "renpy.exe") -ArgumentList @(
            (Join-Path $env:GITHUB_WORKSPACE "renpy"),
            "lint"
          ) -Wait -PassThru
          if ($lint.ExitCode -ne 0) { exit $lint.ExitCode }
      - name: Lint Ren'Py project (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: renpy
        run: |
          sdk="$GITHUB_WORKSPACE/.renpy-sdk/renpy-$RENPY_VERSION-sdk"
          "$sdk/renpy.sh" "$GITHUB_WORKSPACE/renpy" lint
      - name: Build Ren'Py distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: renpy
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE ".renpy-sdk\renpy-$env:RENPY_VERSION-sdk"
          $destination = Join-Path $env:GITHUB_WORKSPACE "renpy\dist"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $build = Start-Process -FilePath (Join-Path $sdk "renpy.exe") -ArgumentList @(
            (Join-Path $sdk "launcher"),
            "distribute",
            "--destination",
            $destination,
            "--package",
            "${{ matrix.package }}",
            (Join-Path $env:GITHUB_WORKSPACE "renpy")
          ) -Wait -PassThru
          if ($build.ExitCode -ne 0) { exit $build.ExitCode }
          $files = @(Get-ChildItem -Path $destination -File)
          if ($files.Count -eq 0) {
            Write-Error "Ren'Py produced no files in $destination"
            exit 1
          }
          $files | Format-Table FullName, Length -AutoSize
      - name: Build Ren'Py distribution (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: renpy
        run: |
          sdk="$GITHUB_WORKSPACE/.renpy-sdk/renpy-$RENPY_VERSION-sdk"
          destination="$GITHUB_WORKSPACE/renpy/dist"
          mkdir -p "$destination"
          "$sdk/renpy.sh" "$sdk/launcher" distribute --destination "$destination" --package "${{ matrix.package }}" "$GITHUB_WORKSPACE/renpy"
          files=$(find "$destination" -maxdepth 1 -type f -print)
          if [ -z "$files" ]; then
            echo "Ren'Py produced no files in $destination" >&2
            exit 1
          fi
          printf '%s\n' "$files"
      - uses: actions/upload-artifact@v7
        with:
          name: amnesia-agent-renpy-${{ matrix.artifact }}
          path: renpy/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
      - kernel-build
      - cli-build
      - local-server-build
      - electron-build
      - renpy-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python kernel artifact
        uses: actions/download-artifact@v8
        with:
          name: python-kernel-dist
          path: release-assets/kernel
      - name: Download Python CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: python-cli-dist
          path: release-assets/cli
      - name: Download Python local server artifact
        uses: actions/download-artifact@v8
        with:
          name: python-local-server-dist
          path: release-assets/local-server
      - name: Download Electron Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: amnesia-agent-electron-windows
          path: release-assets/electron-windows
      - name: Download Electron macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: amnesia-agent-electron-macos
          path: release-assets/electron-macos
      - name: Download Electron Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: amnesia-agent-electron-linux
          path: release-assets/electron-linux
      - name: Download Ren'Py Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: amnesia-agent-renpy-windows
          path: release-assets/renpy-windows
      - name: Download Ren'Py macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: amnesia-agent-renpy-macos
          path: release-assets/renpy-macos
      - name: Download Ren'Py Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: amnesia-agent-renpy-linux
          path: release-assets/renpy-linux
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-assets"
          zip -qr python-kernel-dist.zip kernel
          zip -qr python-cli-dist.zip cli
          zip -qr python-local-server-dist.zip local-server
          zip -qr amnesia-agent-electron-windows.zip electron-windows
          zip -qr amnesia-agent-electron-macos.zip electron-macos
          zip -qr amnesia-agent-electron-linux.zip electron-linux
          zip -qr amnesia-agent-renpy-windows.zip renpy-windows
          zip -qr amnesia-agent-renpy-macos.zip renpy-macos
          zip -qr amnesia-agent-renpy-linux.zip renpy-linux
          ls -l
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Amnesia Agent ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/python-kernel-dist.zip
            release-assets/python-cli-dist.zip
            release-assets/python-local-server-dist.zip
            release-assets/amnesia-agent-electron-windows.zip
            release-assets/amnesia-agent-electron-macos.zip
            release-assets/amnesia-agent-electron-linux.zip
            release-assets/amnesia-agent-renpy-windows.zip
            release-assets/amnesia-agent-renpy-macos.zip
            release-assets/amnesia-agent-renpy-linux.zip
