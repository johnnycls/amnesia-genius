[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-agent-cli"
version = "0.0.0a0"
description = "Minimal terminal CLI for amnesia-agent-kernel."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.15"
dependencies = ["amnesia-agent-kernel>=0.0.0a0,<0.1.0"]

[project.scripts]
amnesia-agent = "amnesia_agent_cli.cli:main"

[tool.setuptools]
packages = ["amnesia_agent_cli"]

[tool.setuptools.package-data]
"amnesia_agent_cli" = ["data/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.mypy]
files = ["amnesia_agent_cli"]
mypy_path = ["../kernel"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"
